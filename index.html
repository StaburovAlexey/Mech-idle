<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#101f28"/><meta name="description" content="ОПЛОТ: 3D-защита турели от мехов. 30 волн, финальный босс и два слоя улучшений."/><link rel="icon" href="./favicon.svg"/><title>ОПЛОТ — Турель и мехи</title><link rel="stylesheet" href="/src/game-frame.css"/><link rel="stylesheet" href="/src/boot.css"/></head><body><div id="game-viewport"><div id="game-stage"><div id="app" inert></div>
<svg class="boot-filter" aria-hidden="true">
  <filter id="boot-tracking" x="0" y="0" width="100%" height="100%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".001 .18" numOctaves="1" seed="7" result="noise"/>
   <feFlood flood-color="#808080" result="neutral"/>
   <feFlood id="boot-band" y="-96" height="96" flood-color="white" result="band"/>
   <feComposite in="noise" in2="band" operator="in" result="strip"/>
   <feComposite in="strip" in2="neutral" operator="over" result="tracking"/>
   <feColorMatrix in="tracking" type="matrix" values="1 0 0 0 0  0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 1" result="map"/>
   <feDisplacementMap in="SourceGraphic" in2="map" scale="25" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
 </svg>
<div id="boot">
 <div id="boot-display">
<div class="boot-terrain"></div><div class="boot-grain"></div>
<div class="boot-viewport"><div class="boot-rule boot-top"><span>СЕКТОР 07</span><span class="boot-signal">ТЕРМИНАЛ</span></div><div class="boot-rule boot-bottom"><span>ПЕРИМЕТР</span><span>ОПЛОТ</span></div></div>
<div class="boot-center">
 <div class="boot-brand"><div class="boot-label">СИСТЕМА ОБОРОНЫ</div><h1>ОПЛОТ</h1></div>
 <div class="boot-console"><svg class="boot-loader" viewBox="0 0 40 40" aria-hidden="true"><circle class="boot-track" cx="20" cy="20" r="16.4"/><circle class="boot-arc" cx="20" cy="20" r="16.4"/></svg><p class="boot-heading" id="boot-status" role="status">ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ</p><button type="button" id="boot-retry" hidden>Повторить</button></div>
</div>
  <noscript><p class="noscript-message">Включите JavaScript, чтобы запустить игру.</p></noscript>
 </div>
 <div id="boot-beam" aria-hidden="true"></div>
</div>
</div></div>
<script type="module" src="/src/game-frame.ts"></script>
<script type="module" src="/src/main.ts"></script></body></html>
